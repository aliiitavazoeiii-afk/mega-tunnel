name: Mega Tunnel domain CI
on:
  push:
  pull_request:
jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Python version
        run: python3 --version
      - name: Static syntax checks
        run: python3 -m compileall -q mega_tunnel tests
      - name: Domain failover / invariants tests
        run: python3 -m unittest discover -s tests -v
      - name: Requirement files must exist
        run: |
          test -s docs/REQUIREMENTS.md
          test -s docs/SECURITY.md
          test -s docs/ARCHITECTURE.md
          test -s docs/ACCEPTANCE.md
          test -s docs/STATUS.md
          test -s docs/OPERATIONS.md
