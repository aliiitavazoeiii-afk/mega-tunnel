name: Mega Tunnel domain CI
on:
  push:
  pull_request:
jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Python version
        run: python3 --version
      - name: Static syntax checks
        run: |
          python3 -m compileall -q mega_tunnel tests ops/diagnose-tcp.py ops/audit-xui294.py
          bash -n ops/preflight-iran.sh ops/preflight-foreign.sh ops/bootstrap-stage0.sh ops/install-naive-lab-foreign.sh ops/repair-naive-lab-foreign.sh ops/install-naive-lab-iran.sh ops/test-naive-lab.sh
      - name: Domain failover / invariants tests
        run: python3 -m unittest discover -s tests -v
      - name: Verify standalone diagnostics have no compile errors
        run: python3 -m py_compile ops/diagnose-tcp.py ops/audit-xui294.py
      - name: Stage1 lab security guards
        run: |
          grep -Fq 'x-ui, Iran routing, UDP' ops/install-naive-lab-foreign.sh
          grep -Fq 'socks://127.0.0.1:' ops/install-naive-lab-iran.sh
          grep -Fq 'sha256sum -c -' ops/install-naive-lab-foreign.sh
          grep -Fq 'sha256sum -c -' ops/install-naive-lab-iran.sh
          grep -Fq 'ProtectSystem=strict' ops/install-naive-lab-iran.sh
          grep -Fq 'ProtectSystem=strict' ops/install-naive-lab-foreign.sh
          grep -Fq 'chmod 0710 "$parent"' ops/install-naive-lab-foreign.sh
          grep -Fq 'chmod 0710 "$parent"' ops/repair-naive-lab-foreign.sh
          grep -Fq 'runuser -u mega-tunnel -- test -r' ops/repair-naive-lab-foreign.sh
          ! grep -Eq 'systemctl (restart|stop|disable) x-ui' ops/install-naive-lab-*.sh
      - name: Requirement files must exist
        run: |
          test -s docs/REQUIREMENTS.md
          test -s docs/SECURITY.md
          test -s docs/ARCHITECTURE.md
          test -s docs/ACCEPTANCE.md
          test -s docs/STATUS.md
          test -s docs/OPERATIONS.md
