name: Mega Tunnel domain CI
on:
  push:
  pull_request:
jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Python version
        run: python3 --version
      - name: Static syntax checks
        run: |
          python3 -m compileall -q mega_tunnel tests ops/diagnose-tcp.py ops/diagnose-naive-lab-iran.py ops/audit-xui294.py
          python3 ops/check-embedded-python.py
          bash -n ops/preflight-iran.sh ops/preflight-foreign.sh ops/bootstrap-stage0.sh ops/install-naive-lab-foreign.sh ops/repair-naive-lab-foreign.sh ops/repair-naive-connect-foreign.sh ops/install-naive-lab-iran.sh ops/resume-naive-lab-iran.sh ops/test-naive-lab.sh ops/install-xhttp-lab-foreign.sh ops/install-xhttp-lab-iran.sh ops/test-two-paths-maya1.sh
      - name: Domain failover / invariants tests
        run: python3 -m unittest discover -s tests -v
      - name: Verify standalone diagnostics have no compile errors
        run: python3 -m py_compile ops/diagnose-tcp.py ops/audit-xui294.py
      - name: Stage1 lab security guards
        run: |
          grep -Fq 'x-ui, Iran routing, UDP' ops/install-naive-lab-foreign.sh
          grep -Fq ':443, $DOMAIN {' ops/install-naive-lab-foreign.sh
          grep -Fq "Authenticated HTTP/1.1 CONNECT example.com:443 =" ops/repair-naive-connect-foreign.sh
          grep -Fq 'if code!="200":' ops/repair-naive-connect-foreign.sh
          grep -Fq 'cp -p "$BACKUP" "$CONF"' ops/repair-naive-connect-foreign.sh
          ! grep -Eq 'systemctl (restart|stop|disable) x-ui' ops/repair-naive-connect-foreign.sh
          grep -Fq 'socks://127.0.0.1:' ops/install-naive-lab-iran.sh
          grep -Fq 'CERTIFICATE VALIDATION ENABLED' ops/diagnose-naive-lab-iran.py
          grep -Fq '"--noproxy", "*"' ops/diagnose-naive-lab-iran.py
          grep -Fq '"--noproxy", ""' ops/diagnose-naive-lab-iran.py
          grep -Fq 'sha256sum -c -' ops/install-naive-lab-foreign.sh
          grep -Fq 'sha256sum -c -' ops/install-naive-lab-iran.sh
          grep -Fq 'ProtectSystem=strict' ops/install-naive-lab-iran.sh
          grep -Fq 'ProtectSystem=strict' ops/install-naive-lab-foreign.sh
          grep -Fq 'chmod 0710 /etc/mega-tunnel' ops/install-naive-lab-iran.sh
          grep -Fq 'chmod 0640 "$D/client.json"' ops/install-naive-lab-iran.sh
          grep -Fq 'runuser -u mega-tunnel -- test -r "$D/client.json"' ops/install-naive-lab-iran.sh
          grep -Fq 'chmod 0710 "$BASE"' ops/resume-naive-lab-iran.sh
          grep -Fq 'no changes to x-ui' ops/resume-naive-lab-iran.sh
          grep -Fq 'Existing client.json differs' ops/resume-naive-lab-iran.sh
          grep -Fq "socks5h://127.0.0.1:" ops/resume-naive-lab-iran.sh
          ! grep -Eq 'apt-get|systemctl (restart|stop|disable) x-ui' ops/resume-naive-lab-iran.sh
          grep -Fq 'chmod 0710 "$parent"' ops/install-naive-lab-foreign.sh
          grep -Fq 'chmod 0710 "$parent"' ops/repair-naive-lab-foreign.sh
          grep -Fq 'runuser -u mega-tunnel -- test -r' ops/repair-naive-lab-foreign.sh
          grep -Fq '[[ "$CODE" == 407 ]]' ops/repair-naive-lab-foreign.sh
          grep -Fq -- "--noproxy '*'" ops/repair-naive-lab-foreign.sh
          ! grep -Fq 'curl -4 -fsS' ops/repair-naive-lab-foreign.sh
          ! grep -Eq 'systemctl (restart|stop|disable) x-ui' ops/install-naive-lab-*.sh
      - name: Stage2 XHTTP REALITY isolation and verifiable artifacts
        run: |
          grep -Fq "ZIPSHA='f851110beaff16e78d643f0ccfd9524b4a44dfd59bae3e34bb52bba378f7690e'" ops/install-xhttp-lab-foreign.sh
          grep -Fq 'sha256sum -c -' ops/install-xhttp-lab-foreign.sh
          grep -Fq '"network":"xhttp"' ops/install-xhttp-lab-foreign.sh
          grep -Fq '"security":"reality"' ops/install-xhttp-lab-foreign.sh
          grep -Fq '"mode":"stream-one"' ops/install-xhttp-lab-foreign.sh
          grep -Fq '"mode":"stream-one"' ops/install-xhttp-lab-iran.sh
          grep -Fq '"udp":False' ops/install-xhttp-lab-iran.sh
          grep -Fq 'xray_binary_sha256' ops/install-xhttp-lab-iran.sh
          grep -Fq 'Password(?:' ops/install-xhttp-lab-foreign.sh
          grep -Fq 'xray-v26.9.30' ops/install-xhttp-lab-iran.sh
          grep -Fq 'run -test -c' ops/install-xhttp-lab-foreign.sh
          grep -Fq 'run -test -c' ops/install-xhttp-lab-iran.sh
          grep -Fq 'socks5h://127.0.0.1:' ops/test-two-paths-maya1.sh
          ! grep -Eq 'apt-get|curl.*bash|systemctl (restart|stop|disable) x-ui' ops/install-xhttp-lab-iran.sh
          ! grep -Eq 'systemctl (restart|stop|disable) x-ui' ops/install-xhttp-lab-foreign.sh
      - name: Requirement files must exist
        run: |
          test -s docs/REQUIREMENTS.md
          test -s docs/SECURITY.md
          test -s docs/ARCHITECTURE.md
          test -s docs/ACCEPTANCE.md
          test -s docs/STATUS.md
          test -s docs/OPERATIONS.md
